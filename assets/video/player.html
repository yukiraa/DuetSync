<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body,#player{width:100%;height:100%;margin:0;background:#000;overflow:hidden}#notice{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;color:#fff;background:#000a;font:13px sans-serif;text-align:center;transition:opacity .5s}#notice.hide{opacity:0}#unlock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000c;z-index:2}#unlock button{font:600 22px sans-serif;padding:18px 34px;border-radius:999px;border:3px solid #26203B;background:#FF6B5B;color:#26203B;box-shadow:0 5px 0 #26203B;cursor:pointer}</style>
</head><body><div id="player"></div><div id="notice">DuetSync video - keep this tab open. This tab's volume is what you hear.</div>
<div id="unlock"><button type="button" id="unlockBtn">Click once to turn on sound</button></div>
<script src="https://www.youtube.com/iframe_api"></script><script>
(() => { 'use strict';
  const role = new URLSearchParams(location.search).get('role') === 'obs' ? 'obs' : 'player';
  const notice = document.getElementById('notice'); if (role === 'obs') notice.remove(); else setTimeout(() => notice.classList.add('hide'), 5000);
  // Browsers only allow programmatic playback WITH sound after one click on the page.
  // OBS browser sources allow autoplay, so they skip this.
  let unlocked = role === 'obs'; const unlock = document.getElementById('unlock');
  if (unlocked) unlock.remove(); else document.getElementById('unlockBtn').addEventListener('click', () => {
    unlocked = true; unlock.remove(); if (player && loaded) player.unMute(); send({t:'unlocked'}); });
  let ws, player, loaded = false, lastState = '', stateTimer, playTimer; const pending = [];
  const pageMs = () => performance.timeOrigin + performance.now();
  const send = o => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(o)); };
  const report = () => { if (!player || !loaded) return; let s = lastState; // Ads cannot be reliably detected through the IFrame API.
    if (s === 'playing' && !player.getVideoData().title) s = 'ad'; send({t:'state',state:s,pos_s:player.getCurrentTime(),page_ms:pageMs()}); };
  const setState = n => { lastState=n; report(); clearInterval(stateTimer); if(n==='playing') stateTimer=setInterval(report,250); };
  window.onYouTubeIframeAPIReady = () => { player = new YT.Player('player',{width:'100%',height:'100%',playerVars:{controls:0,disablekb:1,playsinline:1,rel:0,modestbranding:1},events:{onReady:()=>{loaded=true;send({t:unlocked?'ready':'needs_click'});pending.splice(0).forEach(command);},onStateChange:e=>{const m={[-1]:'unstarted',[0]:'ended',[1]:'playing',[2]:'paused',[3]:'buffering',[5]:'cued'};setState(m[e.data]||'unstarted');},onError:e=>send({t:'error',code:e.data})}}); };
  const command = m => { if(m.t==='ping') send({t:'pong',id:m.id,t1:m.t1,t2:pageMs()}); if(!player || !loaded) { if(m.t!=='ping') pending.push(m); return; }
    if(m.t==='load') player.cueVideoById(m.videoId); else if(m.t==='cue'){player.seekTo(m.pos_s,true);player.pauseVideo();}
    else if(m.t==='play_at'){clearTimeout(playTimer);player.seekTo(m.from_s,true);playTimer=setTimeout(()=>player.playVideo(),Math.max(0,m.page_ms-pageMs()));}
    else if(m.t==='pause') player.pauseVideo(); else if(m.t==='seek') player.seekTo(m.pos_s,true); else if(m.t==='stop'){player.stopVideo();player.clearVideo();} };
  const connect = () => { ws = new WebSocket('ws://'+location.host+'/ws?role='+role); ws.onmessage=e=>{try{command(JSON.parse(e.data));}catch(_){}}; ws.onclose=()=>setTimeout(connect,2000); }; connect();
})();
</script></body></html>
